set timeout=3
set default=0

insmod all_video
insmod gfxterm
set gfxmode=1024x768x32,auto
set gfxpayload=keep

menuentry "POLER-OS v0.20.0-rc (CachyOS Net-Boot Live — GNOME / Pacman)" {
    insmod all_video
    insmod vbe
    insmod vga
    insmod gfxterm
    set gfxpayload=keep
    insmod multiboot2
    insmod part_msdos
    insmod elf
    echo "Loading POLER-OS v0.20.0-rc Net-Boot Kernel & Userspace..."
    multiboot2 /boot/poler-os64 netboot=auto desktop=gnome
    module2 /boot/live-initrd.cpio initrd
    boot
}

menuentry "POLER-OS v0.20.0-rc (Interactive POSIX Shell + Pacman CLI)" {
    insmod all_video
    insmod vbe
    insmod vga
    insmod gfxterm
    set gfxpayload=keep
    insmod multiboot2
    insmod part_msdos
    insmod elf
    echo "Loading POLER-OS v0.20.0-rc Shell..."
    multiboot2 /boot/poler-os64 desktop=sh
    module2 /boot/live-initrd.cpio initrd
    boot
}

menuentry "POLER-OS v0.20.0-rc (Serial Headless Console)" {
    insmod multiboot2
    insmod part_msdos
    insmod elf
    echo "Loading POLER-OS v0.20.0-rc Serial..."
    multiboot2 /boot/poler-os64 console=serial desktop=sh
