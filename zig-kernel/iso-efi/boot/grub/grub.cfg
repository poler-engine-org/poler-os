set timeout=1
set default=0

# Force text mode (80x25) — no graphical framebuffer
# This ensures VGA text buffer at 0xB8000 is active when kernel starts
set gfxpayload=text

menuentry "POLER-OS v0.20.0-rc (64-bit, Ring 3)" {
    insmod efi_gop
    insmod efi_uga
    insmod font
    insmod part_msdos
    insmod part_gpt
    echo "Loading POLER-OS v0.20.0-rc (UEFI)..."
    multiboot2 /boot/poler-os64
    boot
}
