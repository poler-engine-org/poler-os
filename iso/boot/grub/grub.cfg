set timeout=3
set default=0

insmod all_video
insmod gfxterm
set gfxmode=1024x768x32,auto
set gfxpayload=keep

menuentry "POLER-OS v0.20.0-rc (64-bit)" {
    insmod multiboot2
    insmod part_msdos
    insmod elf
    echo "Loading POLER-OS v0.20.0-rc (Arch/CachyOS Userspace)..."
    multiboot2 /boot/poler-os64
    module2 /boot/live-initrd.cpio
    boot
}

menuentry "POLER-OS v0.20.0-rc (64-bit, serial console)" {
    insmod multiboot2
    insmod part_msdos
    insmod elf
    echo "Loading POLER-OS v0.20.0-rc (serial)..."
    multiboot2 /boot/poler-os64 console=serial
    module2 /boot/live-initrd.cpio
    boot
}


menuentry "POLER-OS v0.3.0 — Text mode (VGA only)" {
    set gfxpayload=text
    multiboot /boot/poler-os
    boot
}
